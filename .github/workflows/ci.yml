name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, types, ATS score & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: ATS score (PDF descargable)
        run: npm test

      - name: Build
        run: npm run build
